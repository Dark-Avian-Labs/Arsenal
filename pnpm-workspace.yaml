packages:
  - apps/*
  - packages/*

overrides:
  # cuimp still depends on tar 7.4.3. Audit requires >=7.5.21.
  tar: '>=7.5.22'
  # express still pins qs <=6.16.0. GHSA-6pq8-jhm2-2vcw is fixed in 6.16.1.
  qs: '>=6.16.1'

allowBuilds:
  '@clerk/shared': true
  better-sqlite3: true
  # postinstall is only the funding banner
  core-js: false
  cuimp: true
  esbuild: true
  # postinstall is only the Open Collective prompt
  tesseract.js: false
  unrs-resolver: true

update:
  githubActions: true

catalog:
  '@clerk/express': ^2.1.88
  '@clerk/react': ^6.18.7
  '@clerk/testing': ^2.2.56
  '@clerk/ui': ^1.42.5
  '@dotenvx/dotenvx': ^2.38.2
  '@fontsource-variable/cascadia-mono': ^5.3.0
  '@fontsource-variable/geist': ^5.3.0
  '@fontsource-variable/geist-mono': ^5.3.0
  '@playwright/test': ^1.65.0
  '@tailwindcss/vite': ^4.3.5
  '@types/better-sqlite3': ^9.6.0
  '@types/express': ^5.0.6
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.3.0
  '@vitest/coverage-v8': ^5.1.0
  better-sqlite3: ^13.1.1
  express: ^5.3.0
  express-rate-limit: ^8.7.4
  helmet: ^8.3.0
  oxfmt: ^0.78.0
  oxlint: ^1.93.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.1
  tailwindcss: ^4.3.5
  typescript: ^7.0.2
  vite: ^8.3.8
  vitest: ^5.1.0
  zod: ^4.6.7

minimumReleaseAgeExclude:
  - '@material-symbols/svg-400@0.48.0'
