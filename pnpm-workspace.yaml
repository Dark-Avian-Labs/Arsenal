packages:
  - apps/*
  - packages/*

overrides:
  # cuimp still depends on tar 7.4.3. Audit requires >=7.5.21.
  tar: '>=7.5.22'

allowBuilds:
  '@clerk/shared': true
  better-sqlite3: true
  cuimp: true
  esbuild: true
  # postinstall is only the Open Collective prompt
  tesseract.js: false
  unrs-resolver: true

update:
  githubActions: true

catalog:
  '@clerk/express': ^2.1.81
  '@clerk/react': ^6.17.8
  '@clerk/testing': ^2.2.48
  '@dotenvx/dotenvx': ^2.38.2
  '@fontsource-variable/cascadia-mono': ^5.3.0
  '@fontsource-variable/geist': ^5.3.0
  '@fontsource-variable/geist-mono': ^5.3.0
  '@playwright/test': ^1.64.1
  '@tailwindcss/vite': ^4.3.3
  '@types/better-sqlite3': ^9.6.0
  '@types/express': ^5.0.6
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/coverage-v8': ^5.0.5
  better-sqlite3: ^13.0.3
  express: ^5.3.0
  express-rate-limit: ^8.7.1
  helmet: ^8.3.0
  oxfmt: ^0.74.0
  oxlint: ^1.89.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: ^8.3.4
  vitest: ^5.0.5
  zod: ^4.6.7

minimumReleaseAgeExclude:
  - '@material-symbols/svg-400@0.48.0'
