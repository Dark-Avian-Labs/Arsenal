name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/ci/**'
      - '.forgejo/workflows/deploy.yml'
      - '.forgejo/workflows/_deploy-app.yml'
  workflow_dispatch:
    inputs:
      apps:
        description: Comma-separated services to deploy (arsenal,sentinel), or "all"
        required: true
        default: all
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: light-node26
    timeout-minutes: 5
    outputs:
      arsenal: ${{ steps.detect.outputs.arsenal }}
      sentinel: ${{ steps.detect.outputs.sentinel }}
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.apps || '' }}
        run: node scripts/ci/changes.mjs

  arsenal:
    needs: changes
    if: needs.changes.outputs.arsenal == 'true'
    uses: ./.forgejo/workflows/_deploy-app.yml
    with:
      app: arsenal
      pm2_name: Arsenal
      port: 3006
    secrets:
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION_ARSENAL }}
      SERVER_PATH: ${{ secrets.SERVER_PATH_ARSENAL }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_KNOWN_HOST: ${{ secrets.SERVER_KNOWN_HOST }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}

  sentinel:
    needs: changes
    if: needs.changes.outputs.sentinel == 'true'
    uses: ./.forgejo/workflows/_deploy-app.yml
    with:
      app: sentinel
      pm2_name: Sentinel
      port: 3005
    secrets:
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION_SENTINEL }}
      SERVER_PATH: ${{ secrets.SERVER_PATH_SENTINEL }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_KNOWN_HOST: ${{ secrets.SERVER_KNOWN_HOST }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}

  discord-status:
    runs-on: light-node26
    timeout-minutes: 5
    needs: [changes, arsenal, sentinel]
    if: always()
    defaults:
      run:
        shell: sh
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Describe deploy
        id: note
        env:
          CHANGES: ${{ needs.changes.result }}
          ARSENAL: ${{ needs.arsenal.result }}
          SENTINEL: ${{ needs.sentinel.result }}
        run: node scripts/ci/deploy-note.mjs
      - name: Send Discord status
        uses: iShark5060/actions-discord-status@66f6681ff19536b7787feecc4fdc20c506de365b # v1.2.1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          job_results: ${{ join(needs.*.result, ',') }}
          mention_on: failure
          content: '<@${{ secrets.DISCORD_USERID }}>'
          title: ${{ github.workflow }}
          description: ${{ steps.note.outputs.description }}
