name: Coderabbit

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: contains(github.event.pull_request.labels.*.name, 'coderabbit')
    runs-on: light-node26
    timeout-minutes: 20
    steps:
      - name: Install git
        shell: sh
        run: apk add --no-cache git

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Review
        uses: iShark5060/actions-coderabbit@8693a951516dc620e58462f63191d7f4612a83db # v1.0.5
        with:
          coderabbit_api_key: ${{ secrets.CODERABBIT_API_KEY }}
          forgejo_token: ${{ secrets.CODERABBIT_TOKEN }}
