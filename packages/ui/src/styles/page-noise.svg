<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180">
  <filter id="n" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" seed="7"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.8" intercept="-0.4"/>
      <feFuncG type="linear" slope="1.8" intercept="-0.4"/>
      <feFuncB type="linear" slope="1.8" intercept="-0.4"/>
    </feComponentTransfer>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="180" height="180" filter="url(#n)"/>
</svg>
