# PR-only starter: there is no ci.yml or deploy. Copy this file into new DAL
# apps. Node jobs use blacksmith-2vcpu-*. Rust compile/release stays on 8vcpu.
# Also please remove all comments from this file. Keep the action version comments.
name: AppBase PR Checks

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 26

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      # Actions are pinned to commit SHAs (tag in comment) so a retargeted or
      # compromised tag cannot inject code into CI. Dependabot keeps the pins
      # current.
      - name: Checkout code
        uses: useblacksmith/checkout@f50565632710173b0e366f2cd39b928d31362815 # v1.6.0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      # Keep the lockfile. Do not delete pnpm-lock.yaml to work around
      # --frozen-lockfile (the old pnpm-install-fresh action). pnpm does not
      # record the root package version, so a version-only bump cannot desync it.

      # `pnpm run validate` is run-quality-checks.mjs. Do not expand this into
      # separate format/lint/typecheck/test steps. Build stays its own step.
      - name: Run quality checks
        run: pnpm run validate

      - name: Build project
        run: pnpm run build

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run end-to-end tests
        run: pnpm run test:e2e
